<ng-container *transloco="let t">
<div class="dashboard-project">
  <p-select
    inputId="dashboardProject"
    [ariaLabel]="t('workItem.kind.project')"
    [options]="projectOptions()"
    optionLabel="label"
    optionValue="id"
    [ngModel]="projectId()"
    (ngModelChange)="projectChange.emit($event)"
    [filter]="true"
    filterBy="label"
    [filterPlaceholder]="t('dashboard.searchProjects')"
    (onFilter)="projectSearch.emit($event)"
    appendTo="body"
    [style]="{ width: '100%' }"
  />
</div>
<div class="dashboard-period-group">
  <div class="dashboard-period">
    <p-select
      inputId="dashboardPeriod"
      [ariaLabel]="t('dashboard.period')"
      [options]="periodOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="period()"
      (ngModelChange)="periodChange.emit($event)"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
  @if (period() === 'custom') {
    <p-datepicker
      inputId="dashboardFrom"
      styleClass="dashboard-datepicker"
      [ariaLabel]="t('dashboard.from')"
      [placeholder]="t('dashboard.from')"
      dateFormat="d M yy"
      appendTo="body"
      iconDisplay="input"
      [showIcon]="true"
      [readonlyInput]="true"
      [minDate]="fromMinDate()"
      [maxDate]="fromMaxDate()"
      [ngModel]="customFrom()"
      (ngModelChange)="customFromChange.emit($event)"
    />
    <span class="dashboard-range__dash" aria-hidden="true">–</span>
    <p-datepicker
      inputId="dashboardTo"
      styleClass="dashboard-datepicker"
      [ariaLabel]="t('dashboard.to')"
      [placeholder]="t('dashboard.to')"
      dateFormat="d M yy"
      appendTo="body"
      iconDisplay="input"
      [showIcon]="true"
      [readonlyInput]="true"
      [minDate]="toMinDate()"
      [maxDate]="toMaxDate()"
      [ngModel]="customTo()"
      (ngModelChange)="customToChange.emit($event)"
    />
  }
</div>

<div class="dashboard-actions">
  @if (period() === 'custom') {
    <button
      type="button"
      class="dashboard-apply"
      [disabled]="!!customError()"
      [title]="customError() ?? t('dashboard.showRange')"
      (click)="apply.emit()"
    >
      {{ t('common.apply') }}
    </button>
  }
  @if (showUpdated()) {
    <div class="dashboard-refresh">
      <span role="status">{{ updatedText() }}</span>
      <button
        type="button"
        class="dashboard-refresh__button"
        [title]="t('dashboard.refresh')"
        [attr.aria-label]="t('dashboard.refresh')"
        [disabled]="loading()"
        (click)="refresh.emit()"
      >
        <i class="pi pi-refresh" [class.pi-spin]="loading()"></i>
      </button>
    </div>
  }
</div>
</ng-container>
