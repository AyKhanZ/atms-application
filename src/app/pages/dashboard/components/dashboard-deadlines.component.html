<section class="panel dashboard-list">
  <header>
    <h2>Due in 7 days</h2>
    <small>Now</small>
  </header>
  @if (rows().length) {
    <ul>
      @for (row of rows(); track row.item.ref.workTaskId) {
        <li>
          <button type="button" (click)="selected.emit(row.item.ref)" [title]="row.item.title">
            <span class="dashboard-list__main">
              <app-work-item-ref
                [type]="row.item.isSubtask ? subtask : task"
                [code]="row.item.code"
              />
              <span class="dashboard-list__title">{{ row.item.title }}</span>
            </span>
            <span class="dashboard-list__meta">
              <app-work-item-priority [priority]="row.priority" />
              <time [attr.datetime]="row.item.deadline">{{
                row.item.deadline | date: 'EEE, d MMM' : '+0400'
              }}</time>
            </span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <app-empty-state icon="pi-calendar" title="No deadlines in the next 7 days" />
  }
</section>
