<app-confirm-dialog [key]="forgotPasswordDialog" />

<form
  [formGroup]="passwordForm"
  (ngSubmit)="save()"
  class="settings-pane"
  *transloco="let t"
  [attr.aria-label]="t('common.security')"
>
  <app-new-password-fields
    [form]="passwordForm"
    [currentPassword]="currentPassword"
    [currentPasswordError]="currentPasswordError()"
    [newPasswordError]="newPasswordError()"
    [pulse]="rulesPulse()"
    (forgotPassword)="confirmForgotPassword()"
  />

  <footer class="settings-pane__actions">
    <p class="settings-pane__note">{{ t('settings.passwordNote') }}</p>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="!hasInput() || saving()"
      (click)="discard()"
    >
      {{ t('common.discard') }}
    </button>
    <button pButton type="submit" [loading]="saving()" [disabled]="!canSubmit()">
      {{ t('settings.changePassword') }}
    </button>
  </footer>
</form>
