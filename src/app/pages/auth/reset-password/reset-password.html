<div class="container">
  <section class="auth-card reset-password-card">
    <header class="auth-card__header reset-password-card__header">
      <h1>Reset your password</h1>
      <p>Create a new strong password for your account</p>
    </header>

    @if (invalidToken()) {
      <div class="token-error" role="alert">
        <p>This password reset link is missing, invalid or expired.</p>
        <a routerLink="/forgot-password">Request a new link</a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-card__content">
        <app-new-password-fields [form]="form" [compact]="true" [pulse]="passwordRulesPulse()" />
        <button
          pButton
          type="submit"
          class="submit-btn"
          [loading]="loading()"
          [disabled]="loading()"
        >
          Reset password
        </button>
      </form>
    }
  </section>
</div>
