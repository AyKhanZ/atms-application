<div class="container">
  <section class="auth-card reset-password-card">
    <header class="auth-card__header reset-password-card__header">
      <h1>Reset your password</h1>
      <p>Create a new strong password for your account</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-card__content">
      <app-password-rules [password]="passwordValue()" [confirmPassword]="confirmValue()"/>

      <label class="field">
        <span>Password</span>
        <div class="password-field">
          <input pInputText maxlength="40" [type]="hidePassword() ? 'password' : 'text'" formControlName="password" />
          <button
            pButton
            type="button"
            text
            rounded
            class="password-toggle-button"
            [icon]="hidePassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            (click)="hidePassword.set(!hidePassword())"
          ></button>
        </div>
        @if (form.controls.password.hasError('required') && form.controls.password.touched) {
          <small>Password is required</small>
        }
      </label>

      <label class="field">
        <span>Confirm password</span>
        <div class="password-field">
          <input pInputText maxlength="40" [type]="hideConfirmPassword() ? 'password' : 'text'" formControlName="confirmPassword" />
          <button
            pButton
            type="button"
            text
            rounded
            class="password-toggle-button"
            [icon]="hideConfirmPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            (click)="hideConfirmPassword.set(!hideConfirmPassword())"
          ></button>
        </div>
        @if (form.controls.confirmPassword.hasError('required') && form.controls.confirmPassword.touched) {
          <small>Confirm password is required</small>
        }
      </label>

      <button pButton type="submit" class="submit-btn" [disabled]="form.invalid">
        Reset password
      </button>
    </form>
  </section>
</div>
