<div class="container" *transloco="let t">
  <section class="auth-card reset-password-card">
    <header class="auth-card__header reset-password-card__header">
      <h1>{{ t('auth.resetTitle') }}</h1>
      <p>{{ t('auth.resetSubtitle') }}</p>
    </header>

    @if (invalidToken()) {
      <div class="token-error" role="alert">
        <p>{{ t('auth.resetLinkInvalid') }}</p>
        <a routerLink="/forgot-password">{{ t('auth.requestNewLink') }}</a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-card__content">
        <app-new-password-fields [form]="form" [compact]="true" [pulse]="passwordRulesPulse()" />
        <button
          pButton
          type="submit"
          class="submit-btn"
          [loading]="loading()"
          [disabled]="loading()"
        >
          {{ t('auth.resetPassword') }}
        </button>
      </form>
    }
  </section>
</div>
