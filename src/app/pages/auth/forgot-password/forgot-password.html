<div class="container">
  <section class="auth-card">
    <header class="auth-card__header">
      <h1>Forgot password?</h1>
      <p>Enter your email address and we will send you a reset link</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field">
        <span>Email</span>
        <input pInputText type="email" maxlength="100" formControlName="email" placeholder="you@example.com" />
        @if (form.controls.email.hasError('email') && form.controls.email.touched) {
          <small>Please enter a valid email address</small>
        }
        @if (form.controls.email.hasError('required') && form.controls.email.touched) {
          <small>Email is required</small>
        }
      </label>

      <div class="navigation-wrapper">
        <a routerLink="/login" class="back-link">Back to login</a>
      </div>

      <button pButton type="submit" class="submit-btn" [disabled]="form.invalid">
        Send
      </button>
    </form>
  </section>
</div>
