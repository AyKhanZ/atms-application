<div class="container">
  <section class="auth-card">
    <header class="auth-card__header">
      <h1>Welcome back!</h1>
      <p>Sign in to your account</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @let formControl = form.controls;

      <label class="field">
        <span>Email</span>
        <input pInputText type="email" maxlength="100" formControlName="email" placeholder="you@example.com" />
        @if (formControl.email.hasError('email') && formControl.email.touched) {
          <small>Please enter a valid email address</small>
        }
        @if (formControl.email.hasError('required') && formControl.email.touched) {
          <small>Email is required</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <div class="password-field">
          <input pInputText maxlength="40" [type]="hidePassword() ? 'password' : 'text'" formControlName="password" />
          <button
            pButton
            type="button"
            text
            rounded
            class="eye-btn"
            [icon]="hidePassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            (click)="hidePassword.set(!hidePassword())"
          ></button>
        </div>
        @if (form.controls.password.hasError('required') && form.controls.password.touched) {
          <small>Password is required</small>
        }
      </label>

      <div class="forgot-wrapper">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button pButton type="submit" class="submit-btn" [disabled]="isLoading() || form.invalid">
        {{ isLoading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
