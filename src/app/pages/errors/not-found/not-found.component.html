<section class="not-found-page" *transloco="let t">
  <app-language-switcher mode="instant" />
  <div class="not-found-card">
    <div class="not-found-art" aria-hidden="true">
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="map-pin"><i class="pi pi-map-marker"></i></div>
      <span class="code code-left">4</span>
      <span class="code code-right">4</span>
    </div>

    <div class="not-found-content">
      <span class="status">404</span>
      <h1>{{ t('errors.pageNotFound') }}</h1>
      <p>{{ t('errors.pageNotFoundHint') }}</p>

      <div class="actions">
        <button type="button" class="primary" (click)="back()">{{ t('common.back') }}</button>
        <button type="button" class="secondary" (click)="logout()">{{ t('nav.logOut') }}</button>
      </div>
    </div>
  </div>
</section>
