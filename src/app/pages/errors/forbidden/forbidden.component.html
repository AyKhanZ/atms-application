<section class="forbidden-page" *transloco="let t">
  <app-language-switcher mode="instant" />
  <div class="forbidden-card">
    <div class="forbidden-art" aria-hidden="true">
      <div class="shield"><i class="pi pi-lock"></i></div>
    </div>

    <div class="forbidden-content">
      <span class="status">403</span>
      <h1>{{ t('errors.accessDenied') }}</h1>
      <p>{{ t('errors.accessDeniedHint') }}</p>

      <div class="actions">
        <button type="button" class="primary" (click)="back()">{{ t('common.back') }}</button>
        <button type="button" class="secondary" (click)="logout()">{{ t('nav.logOut') }}</button>
      </div>
    </div>
  </div>
</section>
