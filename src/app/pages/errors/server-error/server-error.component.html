<main class="server-page" *transloco="let t">
  <app-language-switcher mode="instant" />
  <section class="server-card">
    <div class="server-visual" aria-hidden="true">
      <div class="server-rack">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <i class="pi pi-wrench"></i>
    </div>

    <div class="server-copy">
      <p class="eyebrow">{{ t('errors.serviceUnavailable') }}</p>
      <h1>{{ t('errors.maintenance') }}</h1>
      <p>{{ t('errors.maintenanceHint') }}</p>
    </div>

    <button pButton type="button" [disabled]="isChecking()" (click)="tryAgain()">
      <i
        class="pi"
        [class.pi-refresh]="!isChecking()"
        [class.pi-spin]="isChecking()"
        [class.pi-spinner]="isChecking()"
      ></i>
      <span>{{ isChecking() ? t('errors.checking') : t('common.retry') }}</span>
    </button>
  </section>
</main>
