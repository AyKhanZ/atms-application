<form class="panel panel-padding filters" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid organizations-filter-grid">
    <div class="field date-field">
      <label for="createdFrom">Created from</label>
      <p-datepicker
        inputId="createdFrom"
        styleClass="filter-datepicker"
        formControlName="createdFrom"
        dateFormat="yy-mm-dd"
        appendTo="body"
        iconDisplay="input"
        [showIcon]="true"
        [maxDate]="createdFromMaxDate()" />
    </div>

    <div class="field date-field">
      <label for="createdTo">Created to</label>
      <p-datepicker
        inputId="createdTo"
        styleClass="filter-datepicker"
        formControlName="createdTo"
        dateFormat="yy-mm-dd"
        appendTo="body"
        iconDisplay="input"
        [showIcon]="true"
        [minDate]="createdToMinDate()"
        [maxDate]="today" />
    </div>
  </div>

  @if (form.hasError('createdDateRange') && (form.touched || form.dirty)) {
    <small class="filter-error">Created from cannot be later than Created to.</small>
  }

  <div class="toolbar">
    <button type="submit" class="apply-button" [disabled]="form.invalid"><i class="pi pi-filter"></i><span>Apply</span></button>
    <app-clear-button (clicked)="clearForm()" />
  </div>
</form>
