<form class="panel panel-padding filters" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <div class="field">
      <label for="status">Status</label>
      <p-select
        inputId="status"
        styleClass="filter-select"
        formControlName="userStatusId"
        [options]="statusOptions()"
        optionLabel="name"
        optionValue="id"
        appendTo="body"
        [loading]="statusesLoading()"
        [disabled]="statusesLoading()"
      />
    </div>

    <div class="field date-field">
      <label for="createdFrom">Created from</label>
      <p-datepicker
        inputId="createdFrom"
        styleClass="filter-datepicker"
        formControlName="createdFrom"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [showIcon]="true"
        iconDisplay="input"
        [maxDate]="createdFromMaxDate()"
      />
    </div>

    <div class="field date-field">
      <label for="createdTo">Created to</label>
      <p-datepicker
        inputId="createdTo"
        styleClass="filter-datepicker"
        formControlName="createdTo"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [showIcon]="true"
        iconDisplay="input"
        [minDate]="createdToMinDate()"
        [maxDate]="today"
      />
    </div>
  </div>

  @if (form.hasError('createdDateRange') && (form.touched || form.dirty)) {
    <small class="filter-error">Created from cannot be later than Created to.</small>
  }

  <div class="toolbar">
    <button type="submit" class="apply-button" [disabled]="form.invalid">
      <i class="pi pi-filter"></i>
      <span>Apply</span>
    </button>
    <app-clear-button (clicked)="clearForm()" />
  </div>
</form>
