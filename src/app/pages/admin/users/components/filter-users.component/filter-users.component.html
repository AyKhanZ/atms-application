<div class="filter-panel" [class.open]="isOpen()">
  <form class="filter-panel__inner" [formGroup]="form">
    <div class="filter-row-main">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Surname</mat-label>
        <input matInput formControlName="surname" placeholder="Enter surname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Enter email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="userStatusId">
          <mat-option [value]="null">All</mat-option>
          @for (s of statuses(); track s.id) {
            <mat-option [value]="s.id">
              {{ s.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="filter-row-secondary">

      <mat-form-field appearance="outline">
        <mat-label>Created From</mat-label>
        <input matInput [matDatepicker]="fromPicker" formControlName="createdFrom" />
        <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
        <mat-datepicker #fromPicker color="primary" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Created To</mat-label>
        <input matInput [matDatepicker]="toPicker" formControlName="createdTo" />
        <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
        <mat-datepicker #toPicker color="primary" />
      </mat-form-field>

    </div>
  </form>

  <div class="filter-actions">
    <button mat-stroked-button class="btn-cancel" (click)="onCancel()">
      Cancel
    </button>
    <button mat-flat-button class="btn-submit" (click)="onSubmit()">
      Filter
    </button>
  </div>
</div>
