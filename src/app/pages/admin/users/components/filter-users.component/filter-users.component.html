<form class="panel panel-padding filters" *transloco="let t" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <div class="field">
      <label id="statusLabel" appLabelFor="status">{{ t('common.status') }}</label>
      <p-select
        inputId="status"
        ariaLabelledBy="statusLabel"
        styleClass="filter-select"
        formControlName="userStatusId"
        [options]="statusOptions()"
        optionLabel="name"
        optionValue="id"
        appendTo="body"
        [loading]="statusesLoading()"
      />
    </div>

    <div class="field date-field">
      <label for="createdFrom">{{ t('users.createdFrom') }}</label>
      <p-datepicker
        inputId="createdFrom"
        styleClass="filter-datepicker"
        formControlName="createdFrom"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [showIcon]="true"
        iconDisplay="input"
        [maxDate]="createdFromMaxDate()"
      />
    </div>

    <div class="field date-field">
      <label for="createdTo">{{ t('users.createdTo') }}</label>
      <p-datepicker
        inputId="createdTo"
        styleClass="filter-datepicker"
        formControlName="createdTo"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [showIcon]="true"
        iconDisplay="input"
        [minDate]="createdToMinDate()"
        [maxDate]="today"
      />
    </div>
  </div>

  @if (form.hasError('createdDateRange') && (form.touched || form.dirty)) {
    <small class="filter-error">{{ t('users.createdRange') }}</small>
  }

  <div class="toolbar">
    <button type="submit" class="apply-button" [disabled]="form.invalid">
      <i class="pi pi-filter"></i>
      <span>{{ t('common.apply') }}</span>
    </button>
    <app-clear-button (clicked)="clearForm()" />
  </div>
</form>
