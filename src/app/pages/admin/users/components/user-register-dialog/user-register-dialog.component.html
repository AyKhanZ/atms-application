<ng-container *transloco="let t">
<p-dialog
  [(visible)]="visible"
  [header]="t('users.register')"
  [modal]="true"
  [style]="{ width: 'min(90vw, 48rem)' }"
  [draggable]="false"
  [resizable]="false"
  [closable]="!isSaving()"
  [focusOnShow]="false"
  appendTo="body"
  styleClass="user-register-dialog"
>
  <form class="register-form" [formGroup]="form" (ngSubmit)="submit()">
    <section class="details-panel">
      <div class="fields-grid">
        <label>
          <span>{{ t('common.name') }} <b>*</b></span>
          <input pInputText formControlName="name" autocomplete="given-name" maxlength="100" />
          <small [class.visible]="hasError('name')">{{ errorMessage('name') || ' ' }}</small>
          <em>{{ nameLength() }}/100</em>
        </label>

        <label>
          <span>{{ t('common.surname') }} <b>*</b></span>
          <input pInputText formControlName="surname" autocomplete="family-name" maxlength="100" />
          <small [class.visible]="hasError('surname')">{{ errorMessage('surname') || ' ' }}</small>
          <em>{{ surnameLength() }}/100</em>
        </label>

        <label>
          <span>{{ t('common.email') }} <b>*</b></span>
          <input
            pInputText
            type="email"
            formControlName="email"
            autocomplete="email"
            maxlength="100"
          />
          <small [class.visible]="hasError('email')">{{ errorMessage('email') || ' ' }}</small>
          <em>{{ emailLength() }}/100</em>
        </label>

        <label appLabelFor="registerRole">
          <span id="registerRoleLabel">{{ t('common.role') }} <b>*</b></span>
          <p-select
            inputId="registerRole"
            ariaLabelledBy="registerRoleLabel"
            styleClass="register-select"
            formControlName="roleId"
            [options]="roleOptions()"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            [placeholder]="t('users.selectRole')"
            [loading]="rolesLoading()"
          />
          <small [class.visible]="hasError('roleId')">{{ errorMessage('roleId') || ' ' }}</small>
        </label>
      </div>

      @if (requiresOrganization()) {
        <label class="organization-field" appLabelFor="registerOrganization">
          <span id="registerOrganizationLabel">{{ t('common.organization') }} <b>*</b></span>
          <p-select
            inputId="registerOrganization"
            ariaLabelledBy="registerOrganizationLabel"
            styleClass="organization-select"
            formControlName="organizationId"
            [options]="organizations()"
            optionLabel="title"
            optionValue="id"
            appendTo="body"
            [placeholder]="t('users.searchOrganization')"
            [filter]="true"
            filterBy="title,voen"
            [loading]="organizationsLoading()"
            [showClear]="true"
            (onFilter)="searchOrganizations($any($event).filter ?? '')"
          >
            <ng-template #selectedItem let-organization>
              @if (organization) {
                <div class="organization-option organization-option--selected">
                  <div class="organization-logo">
                    @if (logoUrl(organization)) {
                      <img
                        [src]="logoUrl(organization)"
                        [alt]="organization.title"
                        (error)="onLogoError(organization)"
                      />
                    } @else {
                      <span>{{ organizationInitials(organization) }}</span>
                    }
                  </div>
                  <span>{{ organization.title }}</span>
                </div>
              }
            </ng-template>

            <ng-template #item let-organization>
              <div class="organization-option">
                <div class="organization-logo">
                  @if (logoUrl(organization)) {
                    <img
                      [src]="logoUrl(organization)"
                      [alt]="organization.title"
                      (error)="onLogoError(organization)"
                    />
                  } @else {
                    <span>{{ organizationInitials(organization) }}</span>
                  }
                </div>
                <div class="organization-copy">
                  <strong>{{ organization.title }}</strong>
                  <small>{{ t('users.voenLine', { label: t('common.voen'), voen: organization.voen }) }}</small>
                </div>
              </div>
            </ng-template>
          </p-select>
          <small [class.visible]="hasError('organizationId')">{{
            errorMessage('organizationId') || ' '
          }}</small>
        </label>
      }
    </section>

    <div class="dialog-actions">
      <button
        pButton
        type="button"
        severity="secondary"
        outlined
        (click)="cancel()"
        [disabled]="isSaving()"
      >
        <i class="pi pi-times"></i>
        <span>{{ t('common.cancel') }}</span>
      </button>
      <button pButton type="submit" [loading]="isSaving()">
        <i class="pi pi-check"></i>
        <span>{{ t('users.registerAction') }}</span>
      </button>
    </div>
  </form>
</p-dialog>
</ng-container>
