<section class="page">
  <h1 class="page-title">Users Management</h1>

  <div class="page-header users-header">
    <app-list-search
      class="users-search"
      placeholder="Search users"
      [value]="searchTerm()"
      (valueChange)="onSearchChange($event)"
    />

    <div class="page-actions">
      <app-filter-toggle-button
        [active]="filtersOpen()"
        [count]="activeFilterCount()"
        (clicked)="toggleFilters()"
      />
      <button type="button" class="register-user-button" (click)="openRegisterUser()">
        <i class="pi pi-user-plus"></i>
        <span>Register user</span>
      </button>
    </div>
  </div>

  @if (filtersOpen()) {
    <app-users-filter
      [filter]="filter()"
      [statuses]="userStatuses()"
      [statusesLoading]="userStatusesLoading()"
      (apply)="applyFilters($event)"
      (clear)="clearFilters()"
    />
  }

  <div class="panel users-table-panel" [class.users-table-panel--locked]="tableRequestsBlocked()">
    <p-table
      class="users-table"
      [value]="users()"
      [lazy]="true"
      [loading]="loading()"
      [paginator]="totalCount() > 0"
      [rows]="filter().pageSize"
      [first]="first()"
      [totalRecords]="totalCount()"
      [rowsPerPageOptions]="[10, 20, 50]"
      [sortField]="filter().sortBy"
      [sortOrder]="tableSortOrder()"
      [tableStyle]="{ 'min-width': '58rem' }"
      dataKey="id"
      [paginatorDropdownAppendTo]="'body'"
      (onLazyLoad)="onLazyLoad($event)"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name" [pSortableColumnDisabled]="tableRequestsBlocked()">Full name <p-sortIcon field="name" /></th>
          <th pSortableColumn="email" [pSortableColumnDisabled]="tableRequestsBlocked()">Email <p-sortIcon field="email" /></th>
          <th pSortableColumn="position" [pSortableColumnDisabled]="tableRequestsBlocked()">Position <p-sortIcon field="position" /></th>
          <th pSortableColumn="userStatus" [pSortableColumnDisabled]="tableRequestsBlocked()">Status <p-sortIcon field="userStatus" /></th>
          <th pSortableColumn="createdAt" [pSortableColumnDisabled]="tableRequestsBlocked()">Created <p-sortIcon field="createdAt" /></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr class="clickable-row" (click)="openDetails(user)">
          <td>
            <div class="user-cell">
              <div class="user-photo">
                @if (user.avatarPath && !avatarLoadFailed(user)) {
                  <img
                    [src]="user.avatarPath"
                    [alt]="fullName(user)"
                    (error)="onAvatarError(user)" />
                } @else {
                  <span>{{ initials(user) }}</span>
                }
              </div>
              <span>{{ fullName(user) }}</span>
            </div>
          </td>
          <td>
            <a class="email-link" [href]="'mailto:' + user.email" (click)="$event.stopPropagation()">
              {{ user.email }}
            </a>
          </td>
          <td>{{ user.position ?? '-' }}</td>
          <td><p-tag [value]="userStatus(user)" /></td>
          <td>{{ user.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr class="empty-row">
          <td colspan="5">
            <div class="table-empty-state">No users found.</div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
