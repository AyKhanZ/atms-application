<p-confirmDialog key="projectParticipantDanger" styleClass="participant-danger-dialog" />

<section class="stakeholders-content">
  @if (!isInternal() && project().organization; as organization) {
    <section class="organization-strip">
      <app-organization-logo [logoPath]="organization.logoPath" [title]="organization.title" />
      <h3>
        <a
          class="organization-link"
          [routerLink]="['/organizations', organization.id]"
          [state]="{ returnUrl: projectReturnUrl }"
        >
          {{ organization.title }}
        </a>
      </h3>
    </section>
  }

  <section class="participants-panel">
    <div class="participants-header">
      <div class="participants-title">
        <h3>Participants</h3>
        <!-- Pending invitations are counted: they take a place until Admin creates the account. -->
        <span
          class="participants-count"
          [attr.aria-label]="participantsCount() + ' of ' + maxParticipants + ' participants'"
        >
          {{ participantsCount() }}/{{ maxParticipants }}
        </span>
      </div>
      @if (canInvite()) {
        <!-- A disabled button gets no pointer events, so the tooltip hangs on the wrapper. -->
        <span
          class="add-participant-wrap"
          [pTooltip]="limitTooltip"
          [tooltipDisabled]="!limitReached()"
          tooltipPosition="top"
        >
          <button
            pButton
            type="button"
            class="add-participant-button"
            [disabled]="limitReached() || isSaving()"
            (click)="openAddDialog()"
          >
            <i class="pi pi-plus"></i>
            <span>Add</span>
          </button>
        </span>
      }
    </div>

    <app-participant-list
      [participants]="project().participants"
      [invitations]="project().invitations"
      [canChangeRole]="canEditParticipants()"
      [removableParticipantIds]="removableParticipantIds()"
      [canCancelInvitations]="canInviteClient()"
      (changeRole)="openRoleDialog($event)"
      (remove)="confirmRemove($event)"
      (cancelInvitation)="confirmCancelInvitation($event)"
    />
  </section>
</section>

<app-add-participant-dialog
  [(visible)]="addDialogVisible"
  [users]="availableUsers()"
  [roles]="roles()"
  [isSaving]="isSaving()"
  [canInviteByEmail]="canInviteByEmail()"
  [participantEmails]="participantEmails()"
  [invitedEmails]="invitedEmails()"
  [inviteError]="inviteError()"
  [placesLeft]="placesLeft()"
  (submitted)="submitAdd($event)"
  (invited)="submitInvite($event)"
/>

<app-change-participant-role-dialog
  [(visible)]="roleDialogVisible"
  [participant]="selectedParticipant()"
  [roles]="roles()"
  [isSaving]="isSaving()"
  (submitted)="submitRole($event)"
/>
