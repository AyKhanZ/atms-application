<ng-container *transloco="let t">
  <p-dialog
    [header]="t('participants.changeRole')"
    [visible]="visible()"
    (visibleChange)="updateVisible($event)"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    (onShow)="initializeForm()"
    styleClass="participant-dialog participant-dialog--narrow"
  >
    @if (participant(); as selectedParticipant) {
      <form class="participant-dialog-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="selected-person">
          <app-profile-avatar
            [imageUrl]="selectedParticipant.avatarPath"
            [fullName]="fullName(selectedParticipant)"
            [initials]="initials(selectedParticipant)"
            [previewEnabled]="false"
          />
          <div class="selected-person__copy">
            <strong>{{ fullName(selectedParticipant) }}</strong>
            <span>{{ selectedParticipant.email }}</span>
          </div>
        </div>

        <div class="field">
          <label id="participantNewRoleLabel" appLabelFor="participantNewRole">{{
            t('common.role')
          }}</label>
          <p-select
            inputId="participantNewRole"
            ariaLabelledBy="participantNewRoleLabel"
            [class.control-invalid]="showError()"
            formControlName="roleId"
            [options]="availableRoles()"
            optionLabel="name"
            optionValue="id"
            [placeholder]="t('participants.selectRole')"
            appendTo="body"
          />
          @if (showError()) {
            <small>{{ t('participants.roleRequired') }}</small>
          }
        </div>

        <div class="dialog-actions">
          <button pButton type="button" outlined="true" (click)="close()">
            {{ t('common.cancel') }}
          </button>
          <button pButton type="submit" [disabled]="isSaving()">{{ t('common.save') }}</button>
        </div>
      </form>
    }
  </p-dialog>
</ng-container>
