<p-dialog
  header="Add participant"
  [visible]="visible()"
  (visibleChange)="updateVisible($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="participant-dialog"
>
  <form class="participant-dialog-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label id="participantUserLabel" appLabelFor="participantUser">User</label>
      <p-select
        inputId="participantUser"
        ariaLabelledBy="participantUserLabel"
        [class.control-invalid]="showError('userId')"
        formControlName="userId"
        [options]="users()"
        optionLabel="email"
        optionValue="id"
        placeholder="Select user"
        [filter]="true"
        filterBy="name,surname,email"
        panelStyleClass="participant-user-select-panel"
        appendTo="body"
      >
        <ng-template #selectedItem let-user>
          <span class="user-selection">
            <app-profile-avatar
              [imageUrl]="user.avatarPath"
              [fullName]="user | personName"
              [initials]="user | personInitials"
              [previewEnabled]="false"
            />
            <span>{{ user | personName }}</span>
          </span>
        </ng-template>
        <ng-template #item let-user>
          <div class="user-option">
            <app-profile-avatar
              [imageUrl]="user.avatarPath"
              [fullName]="user | personName"
              [initials]="user | personInitials"
              [previewEnabled]="false"
            />
            <span
              ><strong>{{ user | personName }}</strong
              ><small>{{ user.email }}</small></span
            >
          </div>
        </ng-template>
      </p-select>
      <small
        class="field-error"
        [class.field-error--visible]="showError('userId')"
        aria-live="polite"
        >{{ showError('userId') ? 'Select a user.' : '' }}</small
      >
    </div>

    <div class="field">
      <label id="participantRoleLabel" appLabelFor="participantRole">Role</label>
      <p-select
        inputId="participantRole"
        ariaLabelledBy="participantRoleLabel"
        [class.control-invalid]="showError('roleId')"
        formControlName="roleId"
        [options]="availableRoles()"
        optionLabel="name"
        optionValue="id"
        placeholder="Select role"
        appendTo="body"
      />
      <small
        class="field-error"
        [class.field-error--visible]="showError('roleId')"
        aria-live="polite"
        >{{ showError('roleId') ? 'Select a role.' : '' }}</small
      >
    </div>

    <div class="dialog-actions">
      <button pButton type="button" outlined="true" (click)="close()">Cancel</button>
      <button pButton type="submit" [disabled]="isSaving()">Add</button>
    </div>
  </form>
</p-dialog>
