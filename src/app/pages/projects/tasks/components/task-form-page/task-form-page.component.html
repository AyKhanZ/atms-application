<section class="page project-form-page task-form-page" *transloco="let t">
  <p-confirmDialog />
  <app-confirm-dialog key="taskClose" />

  <div class="page-header create-header">
    <h1 class="page-title">{{ pageTitle() }}</h1>
    <div class="create-actions">
      <app-back-button (back)="cancel()" />
      <button
        pButton
        type="button"
        severity="secondary"
        outlined="true"
        [disabled]="saving()"
        (click)="cancel()"
      >
        <i class="pi pi-times"></i><span>{{ t('common.cancel') }}</span>
      </button>
      <button pButton type="submit" form="taskForm" [loading]="saving()" [disabled]="loading()">
        <i class="pi pi-check"></i><span>{{ submitLabel() }}</span>
      </button>
    </div>
  </div>

  @if (loading()) {
    <section class="panel"><app-loading-state [text]="t('tasks.loadingForm')" /></section>
  } @else if (loadError()) {
    <section class="panel task-form-state task-form-state--error" role="alert">
      <i class="pi pi-exclamation-circle"></i><strong>{{ t('tasks.formUnavailable') }}</strong
      ><span>{{ loadError() }}</span>
      <button pButton type="button" outlined="true" (click)="cancel()">{{ t('common.back') }}</button>
    </section>
  } @else {
    <section class="panel project-form-panel">
      <app-task-form-fields
        [form]="form"
        [submitted]="submitted()"
        [priorities]="priorities()"
        [statuses]="statuses()"
        [assignees]="assignees()"
        [isEdit]="isEdit()"
        (submitForm)="submit()"
      >
        <div task-parent>
          <!-- editable in both modes, moving to another ticket/task is a normal change -->
          @if (projectId && ticketId) {
            <app-task-parent-select
              [projectId]="projectId"
              [ticketId]="ticketId"
              [isSubtask]="isSubtask()"
              [selection]="selectedParent()"
              [disabled]="saving()"
              [invalid]="
                submitted() &&
                (form.controls.workTicketId.invalid || form.controls.parentWorkTaskId.invalid)
              "
              (selected)="selectParent($event)"
            />
          }
        </div>
      </app-task-form-fields>
    </section>
  }
</section>
