<div class="work-item-details-content">
  <div class="task-main">
    <app-collapsible-section title="Description" [(open)]="descriptionOpen">
      <div class="task-description">
        @if (task().description; as description) {
          <p class="description">{{ description }}</p>
        } @else {
          <p class="inline-empty">No description has been added.</p>
        }
      </div>
    </app-collapsible-section>

    <!-- Under the description, as in Azure DevOps: the work first, the talk about it after. -->
    <app-collapsible-section id="discussion" title="Discussion" [(open)]="discussionOpen">
      <app-comments-discussion
        [projectId]="task().workProjectId"
        [workTaskId]="task().id"
        [canWrite]="canComment()"
        [participants]="participants()"
      />
    </app-collapsible-section>
  </div>
  <aside class="work-item-information">
    <app-work-item-facts [facts]="facts()" />
    <app-task-location [task]="task()" />
  </aside>
</div>
