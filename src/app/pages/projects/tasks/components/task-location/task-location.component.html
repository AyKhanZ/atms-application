@let item = task();

<section class="task-location">
  <h3>Location</h3>

  <div class="location-tree">
    <span class="location-level location-level--group">
      <i class="pi pi-folder" aria-hidden="true"></i>
      <span>{{ item.groupTitle }}</span>
    </span>

    <div class="location-branch">
      <span class="location-level location-level--milestone">
        <i class="pi pi-flag" aria-hidden="true"></i>
        <span>{{ item.milestoneTitle }}</span>
      </span>

      <div class="location-branch">
        <span class="location-level location-level--ticket">
          <i class="pi pi-ticket" aria-hidden="true"></i>
          <span>#{{ item.workTicketCode }} {{ item.workTicketTitle }}</span>
        </span>

        <div class="location-branch">
          @if (item.parentWorkTaskId) {
            <span class="location-level location-level--task">
              <i class="pi pi-check-square" aria-hidden="true"></i>
              <span>#{{ item.parentWorkTaskCode }} {{ item.parentWorkTaskTitle }}</span>
            </span>

            @if (allowJump()) {
              <div class="location-branch">
                <app-work-item-jump
                  [current]="item"
                  [items]="jump.items()"
                  icon="pi-sitemap"
                  label="Switch subtask"
                  [context]="jumpContext()"
                  [groupLabel]="item.parentWorkTaskTitle || item.workTicketTitle"
                  [loading]="jump.loading()"
                  [loadError]="jump.error()"
                  [initialized]="jump.initialized()"
                  [hasMore]="jump.hasMore()"
                  [searchTerm]="jump.term()"
                  (searchChanged)="jump.search($event)"
                  (more)="jump.loadMore()"
                  (retry)="jump.retry()"
                  (selected)="selectSibling($event)"
                />
              </div>
            }
          } @else if (allowJump()) {
            <app-work-item-jump
              [current]="item"
              [items]="jump.items()"
              icon="pi-check-square"
              label="Switch task"
              [context]="jumpContext()"
              [groupLabel]="item.workTicketTitle"
              [loading]="jump.loading()"
              [loadError]="jump.error()"
              [initialized]="jump.initialized()"
              [hasMore]="jump.hasMore()"
              [searchTerm]="jump.term()"
              (searchChanged)="jump.search($event)"
              (more)="jump.loadMore()"
              (retry)="jump.retry()"
              (selected)="selectSibling($event)"
            />
          }
        </div>
      </div>
    </div>
  </div>
</section>
