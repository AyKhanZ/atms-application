<ng-container *transloco="let t">
@for (group of groups(); track group.id) {
  <section class="history-group" [attr.aria-labelledby]="'history-group-' + $index">
    <button
      type="button"
      class="history-group__head"
      [id]="'history-group-' + $index"
      [attr.aria-expanded]="!collapsed().has(group.id)"
      (click)="toggle(group.id)"
    >
      <i
        class="pi"
        [class.pi-chevron-down]="!collapsed().has(group.id)"
        [class.pi-chevron-right]="collapsed().has(group.id)"
        aria-hidden="true"
      ></i>
      <span>{{ t(groupKey(group.id)) }}</span>
    </button>

    @if (!collapsed().has(group.id)) {
      <ul class="history-rows">
        @for (entry of group.entries; track entry.id) {
          <li>
            <button
              type="button"
              class="history-row"
              [class.is-selected]="entry.id === selectedId()"
              [attr.aria-current]="entry.id === selectedId() ? 'true' : null"
              [attr.data-entry-id]="entry.id"
              (click)="select.emit(entry)"
              (keydown.arrowDown)="move($event, entry, 1)"
              (keydown.arrowUp)="move($event, entry, -1)"
            >
              <app-history-author-avatar [author]="entry.createdBy" />
              <span class="history-row__text">
                <span class="history-row__summary">
                  <strong>{{ entry.createdBy | personName: t('dashboard.activity.system') }}</strong>
                  {{ entry | historySummary: subject() }}
                </span>
                @if (entry.changes.length > 1) {
                  <span class="history-row__fields">{{ entry | historyFieldList }}</span>
                }
              </span>
              <span class="history-row__side">
                @if (entry | historyMarker; as marker) {
                  <span
                    class="history-marker"
                    aria-hidden="true"
                    [pTooltip]="marker.tooltip"
                    tooltipPosition="left"
                  >
                    @if (marker.kind === 'status') {
                      <app-history-value
                        [field]="statusField"
                        [value]="marker.status"
                        [entityType]="entry.entityType"
                        [projectId]="projectId()"
                        [dotOnly]="true"
                      />
                    } @else {
                      <i class="pi" [class]="'pi ' + marker.icon"></i>
                    }
                  </span>
                }
                <time
                  class="history-row__time"
                  [attr.datetime]="entry.createdAt"
                  [title]="entry.createdAt | historyTime: 'full'"
                >
                  {{ entry.createdAt | historyTime }}
                </time>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </section>
}

@if (hasMore()) {
  <div class="history-more">
    @if (loadMoreError(); as error) {
      <small class="history-more__error" role="alert">{{ error }}</small>
    }
    <app-load-more-button [loading]="loadingMore()" (clicked)="loadMore.emit()" />
  </div>
}
</ng-container>
