<ng-container *transloco="let t">
<div class="history-tab">
  @if (loading()) {
    <div class="history-skeleton" role="status" [attr.aria-label]="t('history.loading')">
      <p-skeleton width="60%" height="1.75rem" />
      <div class="history-skeleton__rows">
        @for (row of skeletonRows; track row) {
          <div class="history-skeleton__row">
            <p-skeleton shape="circle" size="2rem" />
            <div class="history-skeleton__text">
              <p-skeleton [width]="row % 2 ? '70%' : '50%'" height="0.85rem" />
              <p-skeleton width="30%" height="0.7rem" />
            </div>
          </div>
        }
      </div>
    </div>
  } @else if (error()) {
    <!-- a failed read is not an alarm, just retry -->
    <app-empty-state
      role="alert"
      icon="pi-history"
      [title]="t('history.unavailable')"
      [description]="t('history.unavailableHint')"
    >
      <button
        pButton
        type="button"
        severity="secondary"
        outlined="true"
        class="history-retry"
        (click)="load()"
      >
        <i class="pi pi-refresh" aria-hidden="true"></i><span>{{ t('common.retry') }}</span>
      </button>
    </app-empty-state>
  } @else if (!entries().length) {
    <app-empty-state
      icon="pi-history"
      [title]="t('history.empty')"
      [description]="t('history.emptyHint')"
    />
  } @else {
    <app-collapsible-section [title]="t('history.statusGraph')" [(open)]="statesOpen">
      <div class="history-section__body">
        <app-history-state-bar
          [states]="list()?.states ?? null"
          [entityType]="entityType()"
          [projectId]="projectId()"
          [current]="currentStatus()"
        />
      </div>
    </app-collapsible-section>

    <app-collapsible-section [title]="t('common.history')" [(open)]="entriesOpen">
      <div class="history-columns" appHistoryPaneHeight [class.is-details-open]="detailsOpen()">
        <div class="history-pane history-pane--list">
          <app-history-list
            [groups]="groups()"
            [selectedId]="selected()?.id ?? null"
            [subject]="subject()"
            [projectId]="projectId()"
            [hasMore]="list()?.hasMore ?? false"
            [loadingMore]="list()?.loadingMore ?? false"
            [loadMoreError]="list()?.loadMoreError ?? null"
            (select)="select($event)"
            (loadMore)="loadMore()"
          />
        </div>

        <div class="history-pane history-pane--details" aria-live="polite">
          <button type="button" class="history-back" (click)="closeDetails()">
            <i class="pi pi-arrow-left" aria-hidden="true"></i>
            <span>{{ t('history.allChanges') }}</span>
          </button>
          @if (selected(); as entry) {
            <app-history-entry-details
              [entry]="entry"
              [subject]="subject()"
              [projectId]="projectId()"
            />
          }
        </div>
      </div>
    </app-collapsible-section>
  }
</div>
</ng-container>
