<form
  class="panel panel-padding project-filters"
  *transloco="let t"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="filter-grid">
    <div class="field">
      <label id="projectTypeLabel" appLabelFor="projectType">{{ t('common.type') }}</label
      ><p-select
        inputId="projectType"
        ariaLabelledBy="projectTypeLabel"
        formControlName="projectTypeId"
        [options]="types()"
        optionLabel="name"
        optionValue="id"
        [placeholder]="t('projects.anyType')"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label id="projectKindLabel" appLabelFor="projectKind">{{ t('common.kind') }}</label
      ><p-select
        inputId="projectKind"
        ariaLabelledBy="projectKindLabel"
        formControlName="projectKindId"
        [options]="kinds()"
        optionLabel="name"
        optionValue="id"
        [placeholder]="t('projects.anyKind')"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label id="projectStatusLabel" appLabelFor="projectStatus">{{ t('common.status') }}</label
      ><p-select
        inputId="projectStatus"
        ariaLabelledBy="projectStatusLabel"
        formControlName="projectStatusId"
        [options]="statuses()"
        optionLabel="name"
        optionValue="id"
        [placeholder]="t('projects.anyStatus')"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="startDate">{{ t('projects.startsFrom') }}</label
      ><p-datepicker
        inputId="startDate"
        formControlName="startDate"
        dateFormat="yy-mm-dd"
        iconDisplay="input"
        [showIcon]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="endDate">{{ t('projects.endsBy') }}</label
      ><p-datepicker
        inputId="endDate"
        formControlName="endDate"
        dateFormat="yy-mm-dd"
        iconDisplay="input"
        [showIcon]="true"
        appendTo="body"
      />
    </div>
  </div>
  @if (form.hasError('dateRange') && (form.touched || form.dirty)) {
    <small class="filter-error">{{ t('projects.filterDateRange') }}</small>
  }
  <div class="toolbar">
    <button type="submit" class="apply-button" [disabled]="form.invalid">
      <i class="pi pi-filter"></i><span>{{ t('common.apply') }}</span></button
    ><app-clear-button (clicked)="clearForm()" />
  </div>
</form>
