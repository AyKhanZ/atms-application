<!-- mousedown is cancelled so a button doesnt take the caret and selection -->
<ng-container *transloco="let t">
<button
  type="button"
  class="highlight__button"
  [title]="t('comments.highlight')"
  [attr.aria-label]="t('comments.highlight')"
  aria-haspopup="true"
  [attr.aria-expanded]="open()"
  (mousedown)="$event.preventDefault()"
  (click)="toggle()"
>
  <span class="highlight__glyph" [attr.data-color]="color()" aria-hidden="true">ab</span>
  <i class="pi pi-chevron-down" aria-hidden="true"></i>
</button>
@if (open()) {
  <span class="highlight__palette" role="group" [attr.aria-label]="t('comments.highlightColors')">
    @for (swatch of colors; track swatch) {
      <button
        type="button"
        class="highlight__swatch"
        [attr.data-color]="swatch"
        [class.is-current]="swatch === color()"
        [title]="t('comments.colors.' + swatch)"
        [attr.aria-label]="t('comments.highlightIn', { color: t('comments.colors.' + swatch) })"
        (mousedown)="$event.preventDefault()"
        (click)="pick(swatch)"
      ></button>
    }
  </span>
}
</ng-container>
