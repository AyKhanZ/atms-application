<div
  class="editor"
  [class.is-invalid]="!!error()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>
  <div class="editor__field">
    <textarea
      #field
      pTextarea
      rows="1"
      [attr.maxlength]="maxLength()"
      [id]="id"
      [attr.aria-label]="label()"
      [placeholder]="placeholder()"
      [value]="text()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="id + '-help'"
      role="combobox"
      aria-autocomplete="list"
      [attr.aria-expanded]="!!trigger()"
      [attr.aria-controls]="trigger() ? id + '-suggestions' : null"
      [attr.aria-activedescendant]="
        trigger() && suggestions().length ? id + '-suggestions-' + activeIndex() : null
      "
      (input)="onInput()"
      (keydown)="onKeydown($event)"
      (keyup)="onKeyup($event)"
      (click)="readTrigger()"
    ></textarea>

    @if (trigger(); as open) {
      <app-comment-suggestions
        class="editor__suggestions"
        [listId]="id + '-suggestions'"
        [trigger]="open.char"
        [items]="suggestions()"
        [activeIndex]="activeIndex()"
        [loading]="open.char === '#' && searching()"
        [currentProjectId]="projectId()"
        [hint]="
          open.char === '#'
            ? 'Type a code, or three letters of a title, to search everything you can open.'
            : null
        "
        (picked)="pick($event)"
      />
    }
  </div>

  <!-- The same row as under a description field: the problem on the left, the count on the right. -->
  <div class="editor__meta" [id]="id + '-help'">
    <small class="editor__error" [attr.role]="error() ? 'alert' : null">{{ error() }}</small>
    @if (active()) {
      <em>{{ stored().length }}/2000</em>
    }
  </div>

  @if (active()) {
    <div class="editor__bar">
      <!-- mousedown is cancelled so a button does not take the caret and the selection it wraps. -->
      <div class="editor__toolbar" role="toolbar" [attr.aria-label]="label() + ' formatting'">
        <button
          type="button"
          title="Mention a person"
          aria-label="Mention a person"
          (mousedown)="$event.preventDefault()"
          (click)="insertTrigger('@')"
        >
          <span class="glyph" aria-hidden="true">&#64;</span>
        </button>
        <button
          type="button"
          title="Link a ticket or task"
          aria-label="Link a ticket or task"
          (mousedown)="$event.preventDefault()"
          (click)="insertTrigger('#')"
        >
          <span class="glyph" aria-hidden="true">#</span>
        </button>
        <span class="editor__separator" aria-hidden="true"></span>
        <button
          type="button"
          title="Bold (Ctrl+B)"
          aria-label="Bold"
          (mousedown)="$event.preventDefault()"
          (click)="format('bold')"
        >
          <span class="glyph glyph--bold" aria-hidden="true">B</span>
        </button>
        <button
          type="button"
          title="Italic (Ctrl+I)"
          aria-label="Italic"
          (mousedown)="$event.preventDefault()"
          (click)="format('italic')"
        >
          <span class="glyph glyph--italic" aria-hidden="true">I</span>
        </button>
        <!-- One control: the button shows the colour and opens the palette; a colour marks the
             selection, the same colour on a marked selection takes the mark off. -->
        <span class="editor__highlight">
          <button
            type="button"
            class="editor__highlight-button"
            title="Highlight"
            aria-label="Highlight"
            aria-haspopup="true"
            [attr.aria-expanded]="paletteOpen()"
            (mousedown)="$event.preventDefault()"
            (click)="togglePalette()"
          >
            <span
              class="glyph glyph--highlight"
              [attr.data-color]="highlightColor()"
              aria-hidden="true"
              >ab</span
            >
            <i class="pi pi-chevron-down" aria-hidden="true"></i>
          </button>
          @if (paletteOpen()) {
            <span class="editor__palette" role="group" aria-label="Highlight colours">
              @for (color of highlightColors; track color) {
                <button
                  type="button"
                  class="editor__swatch"
                  [attr.data-color]="color"
                  [class.is-current]="color === highlightColor()"
                  [title]="color"
                  [attr.aria-label]="'Highlight in ' + color"
                  (mousedown)="$event.preventDefault()"
                  (click)="highlight(color)"
                ></button>
              }
            </span>
          }
        </span>
        <button
          type="button"
          title="Code"
          aria-label="Code"
          (mousedown)="$event.preventDefault()"
          (click)="format('code')"
        >
          <i class="pi pi-code" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          title="Link (Ctrl+K)"
          aria-label="Link"
          (mousedown)="$event.preventDefault()"
          (click)="format('link')"
        >
          <i class="pi pi-link" aria-hidden="true"></i>
        </button>
        <span class="editor__separator" aria-hidden="true"></span>
        <button
          type="button"
          title="Bulleted list"
          aria-label="Bulleted list"
          (mousedown)="$event.preventDefault()"
          (click)="format('bullets')"
        >
          <i class="pi pi-list" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          title="Numbered list"
          aria-label="Numbered list"
          (mousedown)="$event.preventDefault()"
          (click)="format('numbers')"
        >
          <span class="glyph" aria-hidden="true">1.</span>
        </button>
        <button
          type="button"
          title="Check list — tick items in the preview"
          aria-label="Check list"
          (mousedown)="$event.preventDefault()"
          (click)="format('checks')"
        >
          <i class="pi pi-check-square" aria-hidden="true"></i>
        </button>
      </div>

      <div class="editor__actions">
        <!-- The Cancel of every form in the project: outlined, with its cross. -->
        <button pButton type="button" severity="secondary" [outlined]="true" (click)="cancel()">
          <i class="pi pi-times" aria-hidden="true"></i><span>Cancel</span>
        </button>
        <button
          pButton
          type="button"
          title="Ctrl+Enter"
          [loading]="busy()"
          [disabled]="!canSubmit()"
          (click)="submit()"
        >
          {{ submitLabel() }}
        </button>
      </div>
    </div>

    @if (text().trim()) {
      <section class="editor__preview" [attr.aria-label]="label() + ' preview'">
        <app-comment-text
          [text]="stored()"
          [mentions]="previewPeople()"
          [references]="previewReferences()"
          [checkable]="true"
          (checkToggled)="toggleCheckInText($event)"
        />
      </section>
    }
  }
</div>
