<!-- mousedown is cancelled so a button doesnt take the caret and selection -->
<ng-container *transloco="let t">
<div class="toolbar" role="toolbar" [attr.aria-label]="t('comments.formatting', { label: label() || t('comments.label') })">
  <button
    type="button"
    [title]="t('comments.mention')"
    [attr.aria-label]="t('comments.mention')"
    (mousedown)="$event.preventDefault()"
    (click)="triggered.emit('@')"
  >
    <span class="glyph" aria-hidden="true">&#64;</span>
  </button>
  <button
    type="button"
    [title]="t('comments.linkWork')"
    [attr.aria-label]="t('comments.linkWork')"
    (mousedown)="$event.preventDefault()"
    (click)="triggered.emit('#')"
  >
    <span class="glyph" aria-hidden="true">#</span>
  </button>
  <span class="toolbar__separator" aria-hidden="true"></span>
  <button
    type="button"
    [title]="t('comments.boldTitle')"
    [attr.aria-label]="t('comments.bold')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('bold')"
  >
    <span class="glyph glyph--bold" aria-hidden="true">B</span>
  </button>
  <button
    type="button"
    [title]="t('comments.italicTitle')"
    [attr.aria-label]="t('comments.italic')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('italic')"
  >
    <span class="glyph glyph--italic" aria-hidden="true">I</span>
  </button>
  <app-highlight-picker (picked)="highlighted.emit($event)" />
  <button
    type="button"
    [title]="t('comments.code')"
    [attr.aria-label]="t('comments.code')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('code')"
  >
    <i class="pi pi-code" aria-hidden="true"></i>
  </button>
  <button
    type="button"
    [title]="t('comments.linkTitle')"
    [attr.aria-label]="t('comments.link')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('link')"
  >
    <i class="pi pi-link" aria-hidden="true"></i>
  </button>
  <span class="toolbar__separator" aria-hidden="true"></span>
  <button
    type="button"
    [title]="t('comments.bullets')"
    [attr.aria-label]="t('comments.bullets')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('bullets')"
  >
    <i class="pi pi-list" aria-hidden="true"></i>
  </button>
  <button
    type="button"
    [title]="t('comments.numbers')"
    [attr.aria-label]="t('comments.numbers')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('numbers')"
  >
    <span class="glyph" aria-hidden="true">1.</span>
  </button>
  <button
    type="button"
    [title]="t('comments.checksHint')"
    [attr.aria-label]="t('comments.checks')"
    (mousedown)="$event.preventDefault()"
    (click)="formatted.emit('checks')"
  >
    <i class="pi pi-check-square" aria-hidden="true"></i>
  </button>
</div>
</ng-container>
