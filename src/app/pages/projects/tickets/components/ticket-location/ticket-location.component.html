@let item = ticket();

<section class="ticket-location">
  <h3>Location</h3>

  <div class="location-tree">
    <span class="location-level location-level--group">
      <i class="pi pi-folder" aria-hidden="true"></i>
      <span>{{ item.groupTitle }}</span>
    </span>

    <div class="location-branch">
      <span class="location-level location-level--milestone">
        <i class="pi pi-flag" aria-hidden="true"></i>
        <span>{{ item.milestoneTitle }}</span>
      </span>

      <div class="location-branch">
        <app-work-item-jump
          [current]="item"
          [items]="jump.items()"
          [kind]="kinds.Ticket"
          label="Switch ticket"
          [context]="jumpContext()"
          [groupLabel]="item.milestoneTitle"
          [loading]="jump.loading()"
          [loadError]="jump.error()"
          [initialized]="jump.initialized()"
          [hasMore]="jump.hasMore()"
          [searchTerm]="jump.term()"
          (searchChanged)="jump.search($event)"
          (more)="jump.loadMore()"
          (retry)="jump.retry()"
          (selected)="selectSibling($event)"
        />
      </div>
    </div>
  </div>

  <button
    pButton
    type="button"
    outlined="true"
    class="view-in-plan-button"
    (click)="viewInPlan.emit()"
  >
    <i class="pi pi-list-check"></i>
    <span>View in Plan</span>
  </button>
</section>
