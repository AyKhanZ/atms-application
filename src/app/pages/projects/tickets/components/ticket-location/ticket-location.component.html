@let item = ticket();

<section class="ticket-location">
  <h3>Location</h3>

  <div class="location-tree">
    <span class="location-group">
      <i class="pi pi-folder" aria-hidden="true"></i>
      <span>{{ item.groupTitle }}</span>
    </span>
    <div class="location-branch">
      <span class="location-milestone">
        <i class="pi pi-flag" aria-hidden="true"></i>
        <strong>{{ item.milestoneTitle }}</strong>
      </span>

      <app-ticket-milestone-jump
        class="location-ticket-switcher"
        [projectId]="item.workProjectId"
        [groupTitle]="item.groupTitle"
        [milestoneTitle]="item.milestoneTitle"
        [milestoneId]="item.milestoneId"
        [currentTicket]="item"
      />
    </div>
  </div>

  <button
    pButton
    type="button"
    outlined="true"
    class="view-in-plan-button"
    (click)="viewInPlan.emit()"
  >
    <i class="pi pi-list-check"></i>
    <span>View in Plan</span>
  </button>
</section>
