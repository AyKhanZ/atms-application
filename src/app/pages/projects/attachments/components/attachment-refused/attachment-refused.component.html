<section class="refused" role="alert" aria-labelledby="attachmentRefusedTitle">
  <i class="pi pi-ban refused__icon" aria-hidden="true"></i>
  <div class="refused__body">
    <strong id="attachmentRefusedTitle">{{ title() }}</strong>
    <ul>
      @for (group of groups(); track group.reason) {
        <li>
          <span class="refused__reason">{{ group.reason }}</span>
          <span class="refused__names">
            @for (name of group.fileNames; track $index) {
              <span class="refused__name" [title]="name">{{ name }}</span>
            }
          </span>
        </li>
      }
    </ul>
  </div>
  <button type="button" class="icon-button" aria-label="Dismiss" (click)="dismiss.emit()">
    <i class="pi pi-times" aria-hidden="true"></i>
  </button>
</section>
