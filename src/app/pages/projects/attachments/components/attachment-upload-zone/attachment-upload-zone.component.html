<ng-container *transloco="let t">
<div
  class="upload-zone"
  [class.upload-zone--dragging]="dragging()"
  (dragenter)="dragEnter($event)"
  (dragover)="dragOver($event)"
  (dragleave)="dragLeave()"
  (drop)="drop($event)"
>
  <span class="upload-zone__icon" aria-hidden="true">
    <i class="pi pi-cloud-upload"></i>
  </span>
  <div class="upload-zone__text">
    <strong>
      @if (dragging()) {
        {{ t('attachments.drop') }}
      } @else {
        <span class="upload-zone__drop">{{ t('attachments.dropOrUpload') }}</span>
        <span class="upload-zone__pick">
          {{ t(kind() === 'subtask' ? 'attachments.addToSubtask' : 'attachments.addToTask') }}
        </span>
      }
    </strong>
    <span
      id="attachmentUploadHint"
      class="upload-zone__hint"
      [title]="t('attachments.typesTitle', { types })"
    >
      {{ t('attachments.hint', { size: sizeLabel() }) }}
    </span>
  </div>
  <button
    pButton
    type="button"
    class="upload-zone__button"
    aria-describedby="attachmentUploadHint"
    (click)="input.click()"
  >
    <i class="pi pi-upload" aria-hidden="true"></i><span>{{ t('attachments.uploadFiles') }}</span>
  </button>
  <input
    #input
    type="file"
    class="upload-zone__input"
    multiple
    tabindex="-1"
    aria-hidden="true"
    [accept]="accept"
    (change)="picked(input)"
  />
</div>
</ng-container>
