<section class="page search-page" *transloco="let t">
  <div class="page-header search-page-header">
    <h1 class="page-title">{{ t('nav.search') }}</h1>
    <div class="page-actions">
      <app-back-button (back)="back()" />
    </div>
  </div>

  <article class="panel search-panel">
    <app-list-search
      class="search-panel__input"
      [placeholder]="t('search.byCodeOrTitle')"
      [value]="query()"
      (valueChange)="changeQuery($event)"
    />

    <app-search-filters [chips]="chips()" [active]="itemType()" (select)="changeType($event)" />

    <div class="search-panel__list">
      @for (item of items(); track item.id) {
        <app-search-result-row
          role="button"
          tabindex="0"
          [item]="item"
          [query]="query()"
          (click)="open(item)"
          (keydown.enter)="open(item)"
          (keydown.space)="$event.preventDefault(); open(item)"
        />
      }

      @if (empty()) {
        <app-empty-state
          icon="pi-search"
          [title]="t('search.none')"
          [description]="t('search.tryDifferent')"
        />
      }

      @if (loading()) {
        <div class="search-panel__skeleton" aria-hidden="true">
          @for (line of [1, 2, 3]; track line) {
            <span></span>
          }
        </div>
      }

      @if (failed()) {
        <div class="search-panel__error" role="alert">
          <span>{{ t('search.loadFailed') }}</span>
          <button type="button" (click)="retry()">{{ t('common.retry') }}</button>
        </div>
      }

      <!-- loads the next page by itself, the button is a fallback -->
      <div [appScrollSentinel]="hasMore() && !loading() && !failed()" (reached)="loadMore()"></div>

      @if (hasMore() && !loading()) {
        <app-load-more-button class="search-panel__more" (clicked)="loadMore()" />
      }
    </div>
  </article>
</section>
