<article
  class="card"
  [class.card--done]="done()"
  role="button"
  tabindex="0"
  [attr.aria-label]="(task().isSubtask ? 'Open subtask ' : 'Open task ') + task().title"
  (click)="open.emit()"
  (keydown.enter)="open.emit()"
>
  <header class="card__head">
    <app-work-item-ref [type]="kind()" [code]="task().code" />
    <button
      type="button"
      class="card__menu"
      [attr.aria-label]="'Actions for ' + task().title"
      (click)="$event.stopPropagation(); actions.toggle($event)"
      (keydown.enter)="$event.stopPropagation()"
    >
      <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
    </button>
  </header>

  <p class="card__title" [title]="task().title">{{ task().title }}</p>

  <p class="card__location" [title]="location().text">
    @if (showProject() && task().workProjectTitle) {
      <i class="pi pi-briefcase" aria-hidden="true"></i>
      <span class="card__project">{{ task().workProjectTitle }}</span>
      <span class="card__separator" aria-hidden="true">›</span>
    }
    <i class="pi" [class]="'pi ' + location().icon" aria-hidden="true"></i>
    <span class="card__parent">{{ location().text }}</span>
  </p>

  <footer class="card__meta">
    <app-work-item-priority [priority]="task().priority" />
    @if (task().deadline; as deadline) {
      <span class="card__deadline" [class.card__deadline--overdue]="overdue()">
        <i class="pi pi-calendar" aria-hidden="true"></i>
        {{ deadline | date: 'dd.MM' }}
      </span>
    }
    <app-work-item-assignee
      class="card__assignee"
      [assignee]="task().assignee"
      [compact]="true"
      [shortName]="true"
    />
  </footer>
</article>
<p-menu #actions [model]="menu()" [popup]="true" appendTo="body" />
