<button
  type="button"
  class="filter-toggle"
  [class.filter-toggle--active]="active()"
  [disabled]="disabled()"
  (click)="clicked.emit()"
>
  <i class="pi pi-filter" aria-hidden="true"></i>
  <span>{{ label() }}</span>

  @if (count() > 0) {
    <span class="filter-count"
      ><span>{{ count() }}</span></span
    >
  }
</button>
