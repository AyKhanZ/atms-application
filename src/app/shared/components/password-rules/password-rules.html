<div class="container">
  <span>Password must contain the following:</span>
  <ul class="password-rules">
    @for (rule of rules(); track rule.label) {
      <li class="password-rules__item" [ngClass]="{ 'password-rules__item--met': rule.met }">
        <mat-icon>{{ rule.met ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
        {{ rule.label }}
      </li>
    }
  </ul>
</div>
