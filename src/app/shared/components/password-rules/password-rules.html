<div class="container">
  <span class="password-rules__title">Password must contain the following:</span>
  <ul class="password-rules">
    @for (rule of rules(); track rule.label) {
      <li class="password-rules__item" [ngClass]="{ 'password-rules__item--met': rule.met }">
        <i class="pi" [class.pi-check-circle]="rule.met" [class.pi-circle]="!rule.met"></i>
        {{ rule.label }}
      </li>
    }
  </ul>
</div>
