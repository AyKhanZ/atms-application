<span
  class="row"
  [class.row--active]="active()"
  [class.row--hoverable]="followsPointer()"
  [class.row--project]="item().itemType === 1"
>
  <span class="row__identity">
    <app-work-item-ref class="row__code" [type]="item().itemType" [code]="item().code" />

    <!-- no spaces between the pieces or the word splits around the highlight; prettier would add them back -->
    <!-- prettier-ignore -->
    <span class="row__title"
    >@for (part of titleParts(); track $index) {<span
      [class.row__title-match]="part.matched"
      >{{ part.text }}</span
    >}</span
  >
  </span>

  <app-work-item-status-badge
    class="row__status"
    [kind]="item().itemType"
    [status]="item().status"
  />

  <app-work-item-assignee
    class="row__assignee"
    [assignee]="item().assignee"
    [compact]="true"
    [shortName]="true"
  />

  @if (trail().length > 0) {
    <span class="row__trail" [title]="trailLabel()" [attr.aria-label]="trailLabel()">
      @for (step of visibleTrail(); track $index; let last = $last) {
        <span class="row__trail-item" [class.row__trail-item--last]="last">
          <i class="pi" [class]="'pi ' + step.icon" aria-hidden="true"></i>
          <span class="row__trail-step">{{ step.label }}</span>
        </span>
        @if (!last) {
          <span class="row__trail-separator" aria-hidden="true">›</span>
          @if (trail().length > 2) {
            <span class="row__trail-overflow" aria-hidden="true">…</span>
            <span class="row__trail-separator" aria-hidden="true">›</span>
          }
        }
      }
    </span>
  }
</span>
