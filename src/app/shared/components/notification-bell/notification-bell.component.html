<app-confirm-dialog [key]="noticeKey" />

<button
  type="button"
  class="bell"
  [class.bell--open]="panelOpen()"
  [attr.aria-label]="buttonLabel()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="panelOpen()"
  (click)="toggle($event)"
>
  <i class="pi pi-bell" aria-hidden="true"></i>
  @if (badge(); as count) {
    <span class="bell__badge" aria-hidden="true">{{ count }}</span>
  }
</button>

<p-popover #panel styleClass="notification-panel" (onShow)="onShow()" (onHide)="onHide()">
  <section class="panel" *transloco="let t" [attr.aria-label]="t('notifications.title')">
    <header class="panel__header">
      <h2 class="panel__title">{{ t('notifications.title') }}</h2>
      <button
        type="button"
        class="panel__action"
        [disabled]="unreadCount() === 0"
        (click)="markAllRead()"
      >
        {{ t('notifications.markAllRead') }}
      </button>
    </header>

    <div class="panel__body">
      @if (!loaded() && loading()) {
        <p class="panel__message">{{ t('common.loading') }}</p>
      } @else if (error() && latest().length === 0) {
        <div class="panel__message">
          <span>{{ error() }}</span>
          <button type="button" class="panel__action" (click)="retry()">{{ t('common.retry') }}</button>
        </div>
      } @else {
        @for (item of latest(); track item.id) {
          <button type="button" class="row" [class.row--unread]="!item.readAt" (click)="open(item)">
            <span class="row__dot" [attr.aria-label]="item.readAt ? null : t('notifications.unread')"></span>
            <app-notification-item class="row__item" [notification]="item" />
          </button>
        } @empty {
          <div class="panel__empty">
            <i class="pi pi-check-circle" aria-hidden="true"></i>
            <span>{{ t('notifications.caughtUp') }}</span>
          </div>
        }
      }
    </div>

    <footer class="panel__footer">
      <button type="button" class="panel__all" (click)="viewAll()">{{ t('common.viewAll') }}</button>
    </footer>
  </section>
</p-popover>
