<div class="pagination">

  <div class="pagination__page-size">
    <span class="pagination__label">Rows per page:</span>
    <p-select
      class="pagination__size-select"
      [options]="pageSizeOptions()"
      [ngModel]="pageSize()"
      (ngModelChange)="onPageSizeChange($event)"
      appendTo="body"
    />
  </div>

  <div class="pagination__info">
    {{ rangeLabel() }}
  </div>

  <div class="pagination__jump">
    <input
      class="pagination__jump-input"
      type="number"
      [min]="1"
      [max]="totalPages()"
      [ngModel]="jumpPage()"
      (ngModelChange)="jumpPage.set($event)"
      (keydown.enter)="onJump()"
      [title]="'Go to page'"
    />
    <span class="pagination__jump-sep">/ {{ totalPages() }}</span>
    <button
      pButton
      type="button"
      icon="pi pi-arrow-right"
      text
      rounded
      class="pagination__btn pagination__btn--go"
      (click)="onJump()"
      pTooltip="Go to page"
    ></button>
  </div>

  <div class="pagination__controls">
    <button
      pButton
      type="button"
      icon="pi pi-angle-double-left"
      text
      rounded
      class="pagination__btn"
      [disabled]="page() <= 1"
      (click)="changePage(1)"
      pTooltip="First page"
    ></button>

    <button
      pButton
      type="button"
      icon="pi pi-angle-left"
      text
      rounded
      class="pagination__btn"
      [disabled]="page() <= 1"
      (click)="changePage(page() - 1)"
      pTooltip="Previous page"
    ></button>


    <button
      pButton
      type="button"
      icon="pi pi-angle-right"
      text
      rounded
      class="pagination__btn"
      [disabled]="page() >= totalPages()"
      (click)="changePage(page() + 1)"
      pTooltip="Next page"
    ></button>

    <button
      pButton
      type="button"
      icon="pi pi-angle-double-right"
      text
      rounded
      class="pagination__btn"
      [disabled]="page() >= totalPages()"
      (click)="changePage(totalPages())"
      pTooltip="Last page"
    ></button>
  </div>
</div>
