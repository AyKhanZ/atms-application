<button
  type="button"
  class="load-more"
  *transloco="let t"
  [class.load-more--compact]="compact()"
  [disabled]="loading()"
  [attr.aria-busy]="loading()"
  (click)="clicked.emit($event)"
>
  @if (loading()) {
    <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
  }
  <span>{{ t('common.loadMore') }}</span>
</button>
