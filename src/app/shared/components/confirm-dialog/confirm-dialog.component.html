<p-confirmDialog [key]="key()" styleClass="app-confirm-dialog">
  <ng-template #headless let-confirmation let-onAccept="onAccept" let-onReject="onReject">
    <section class="confirm" [attr.data-tone]="tone(confirmation)">
      <header class="confirm__head">
        <span class="confirm__icon" aria-hidden="true">
          <i
            class="pi"
            [class]="isNotice(confirmation) ? 'pi pi-info-circle' : 'pi pi-exclamation-triangle'"
          ></i>
        </span>
        <h2 class="confirm__title">{{ confirmation.header }}</h2>
      </header>

      <div class="confirm__body">
        @if (subject(confirmation); as subjectLine) {
          <p class="confirm__subject" [title]="subjectLine">{{ subjectLine }}</p>
        }
        <p class="confirm__message">{{ detail(confirmation) }}</p>
      </div>

      <footer class="confirm__actions">
        @if (!isNotice(confirmation)) {
          <button pButton type="button" outlined="true" (click)="onReject()">
            {{ confirmation.rejectLabel || 'Cancel' }}
          </button>
        }
        <button
          pButton
          type="button"
          [severity]="tone(confirmation) === 'danger' ? 'danger' : 'primary'"
          (click)="onAccept()"
        >
          {{ acceptLabel(confirmation) }}
        </button>
      </footer>
    </section>
  </ng-template>
</p-confirmDialog>
