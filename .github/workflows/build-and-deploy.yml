name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: corepack enable && corepack prepare npm@11.6.1 --activate && corepack npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --watch=false

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short image tag
        id: tag
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aykhanz/atms-web:sha-${{ steps.tag.outputs.short_sha }}
            ghcr.io/aykhanz/atms-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart web
        env:
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          umask 077
          key_file="${RUNNER_TEMP}/demo_key"
          known_hosts="${RUNNER_TEMP}/known_hosts"
          # A .pem pasted on Windows keeps its CR line endings, and OpenSSH rejects it.
          printf '%s\n' "$DEMO_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh-keyscan "$DEMO_HOST" > "$known_hosts"

          ssh_opts=(
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )

          ssh "${ssh_opts[@]}" "${DEMO_USER}@${DEMO_HOST}" \
            "cd /srv/atms && docker compose pull web && docker compose up -d web"
